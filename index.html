<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YX Design Scanner</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: "Courier New", monospace;

  background:
    radial-gradient(
      circle at 50% 25%,
      rgba(255,255,255,.30),
      transparent 42%
    ),
    linear-gradient(
      90deg,
      rgba(110,74,42,.06) 1px,
      transparent 1px
    ),
    linear-gradient(
      #b99d7d,
      #aa8c6d
    );

  background-size:
    auto,
    95px 100%,
    auto;
}


/* =========================================================
   DESK
========================================================= */

.desk {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 720px;
}

.desk::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1000;
  opacity: .11;

  background-image:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(255,255,255,.15) 4px
    );
}


/* =========================================================
   TEXT
========================================================= */

.title {
  position: fixed;
  left: 30px;
  top: 27px;
  z-index: 900;

  font-size: 14px;
  line-height: 1.5;
  letter-spacing: 1px;

  color: #181511;
  pointer-events: none;
}

.title strong {
  font-size: 17px;
}

.instruction {
  position: fixed;
  right: 32px;
  top: 30px;
  z-index: 900;

  text-align: right;

  font-size: 12px;
  line-height: 1.55;
  letter-spacing: .7px;

  color: rgba(20,15,10,.75);

  pointer-events: none;
}


/* =========================================================
   SCANNER
========================================================= */

.scanner-wrap {
  position: absolute;

  left: 50%;
  top: 49%;

  width: min(690px, 54vw);

  transform: translate(-50%, -50%);

  z-index: 20;
}

.scanner {
  display: block;
  width: 100%;
  height: auto;

  position: relative;
  z-index: 10;

  pointer-events: none;

  filter:
    drop-shadow(
      0 24px 24px
      rgba(40,25,10,.32)
    );
}


/* =========================================================
   CRT
========================================================= */

.crt {
  position: absolute;

  left: 17.7%;
  top: 12.4%;

  width: 69.3%;
  height: 38.3%;

  z-index: 12;

  overflow: hidden;

  border-radius: 5% / 8%;

  pointer-events: none;
}

.scan-result {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  padding: 4%;

  opacity: 0;

  transform: scale(.97);

  mix-blend-mode: screen;

  filter:
    contrast(1.05)
    brightness(.95);

  transition:
    opacity .5s ease,
    transform .6s ease;
}

.scan-result.show {
  opacity: .90;
  transform: scale(1);
}

.crt-lines {
  position: absolute;
  inset: 0;

  z-index: 10;

  pointer-events: none;

  opacity: .20;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.08) 0px,
      rgba(255,255,255,.08) 1px,
      rgba(0,0,0,.08) 2px,
      rgba(0,0,0,.08) 4px
    );
}

.crt-glow {
  position: absolute;
  inset: 0;

  z-index: 9;

  pointer-events: none;

  box-shadow:
    inset 0 0 28px
    rgba(52,239,255,.12);

  opacity: .7;
}


/* =========================================================
   SCREEN MESSAGE
========================================================= */

.screen-message {
  position: absolute;

  left: 8%;
  bottom: 7%;

  z-index: 20;

  color: #9efaff;

  font-size: clamp(8px, .8vw, 12px);

  line-height: 1.3;

  text-shadow:
    0 0 7px
    rgba(73,235,255,.65);

  pointer-events: none;
}


/* =========================================================
   SCAN LIGHT
========================================================= */

.scan-light {
  position: absolute;

  left: 0;
  top: -8%;

  width: 100%;
  height: 7%;

  z-index: 30;

  opacity: 0;

  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,0),
      rgba(130,255,255,.25),
      rgba(170,255,255,.95),
      rgba(130,255,255,.25),
      rgba(255,255,255,0)
    );

  box-shadow:
    0 0 15px rgba(100,255,255,.8),
    0 0 28px rgba(100,255,255,.5);
}

.crt.scanning .scan-light {
  opacity: 1;
  animation: scanning 2.2s linear forwards;
}

@keyframes scanning {

  0% {
    top: -8%;
  }

  100% {
    top: 102%;
  }

}

.crt.scanning {
  animation: crtFlicker .14s steps(2) infinite;
}

@keyframes crtFlicker {

  0% {
    filter: brightness(1);
  }

  50% {
    filter: brightness(1.14);
  }

  100% {
    filter: brightness(.96);
  }

}


/* =========================================================
   TRAY
========================================================= */

.tray-zone {
  position: absolute;

  left: 20%;
  top: 63%;

  width: 60%;
  height: 18%;

  z-index: 60;

  border-radius: 8px;

  pointer-events: none;

  transition:
    background .2s ease,
    box-shadow .2s ease;
}

.tray-zone.hover {
  background: rgba(116,255,221,.09);

  box-shadow:
    inset 0 0 0 2px rgba(100,255,220,.38),
    0 0 25px rgba(100,255,220,.18);
}


/* =========================================================
   SCAN BUTTON
========================================================= */

.scan-button {
  position: absolute;

  left: 64.5%;
  top: 55%;

  width: 8.5%;
  height: 6.5%;

  z-index: 100;

  cursor: pointer;

  border: none;
  background: transparent;

  border-radius: 4px;
}

.scan-button.ready:hover {
  background: rgba(70,255,205,.15);

  box-shadow:
    0 0 17px rgba(70,255,205,.65);

  animation: buttonPulse 1s ease-in-out infinite;
}

@keyframes buttonPulse {

  0%,
  100% {
    box-shadow:
      0 0 8px rgba(70,255,205,.35);
  }

  50% {
    box-shadow:
      0 0 20px rgba(70,255,205,.9);
  }

}


/* =========================================================
   OBJECTS
========================================================= */

.object {
  position: absolute;

  z-index: 200;

  object-fit: contain;

  cursor: grab;

  user-select: none;
  -webkit-user-select: none;

  transform-origin: center center;

  filter:
    drop-shadow(
      0 12px 9px
      rgba(30,20,10,.28)
    );

  transition:
    transform .18s ease,
    filter .18s ease;
}

.object:hover {
  filter:
    drop-shadow(
      0 17px 12px
      rgba(30,20,10,.34)
    );
}

.object.dragging {
  z-index: 800;

  cursor: grabbing;

  transition: none;

  filter:
    drop-shadow(
      0 25px 18px
      rgba(30,20,10,.35)
    );
}


/* =========================================================
   START POSITIONS
========================================================= */

#greenPoster {
  width: 190px;

  left: 5%;
  top: 18%;

  transform: rotate(-8deg);
}

#blueBooklet {
  width: 205px;

  right: 5%;
  top: 16%;

  transform: rotate(7deg);
}

#whiteBook {
  width: 215px;

  right: 7%;
  bottom: 6%;

  transform: rotate(-5deg);
}


/* =========================================================
   INSERTED OBJECT
========================================================= */

.object.inserted {
  z-index: 55;

  cursor: default;

  filter:
    drop-shadow(
      0 5px 4px
      rgba(20,15,10,.28)
    );
}


/* =========================================================
   LARGE SCAN PREVIEW — NEW
========================================================= */

.large-preview {
  position: fixed;

  left: 4%;
  top: 50%;

  width: min(310px, 20vw);
  height: 55vh;

  transform:
    translateY(-44%)
    scale(.94);

  z-index: 500;

  opacity: 0;
  visibility: hidden;

  pointer-events: none;

  transition:
    opacity .45s ease,
    transform .55s cubic-bezier(.2,.8,.2,1),
    visibility .45s;

  cursor: zoom-in;
}

.large-preview.show {
  opacity: 1;
  visibility: visible;

  pointer-events: auto;

  transform:
    translateY(-44%)
    scale(1);
}

.large-preview-label {
  font-size: 10px;

  letter-spacing: 1px;

  margin-bottom: 9px;

  color: rgba(20,15,10,.72);
}

.large-preview-frame {
  position: relative;

  width: 100%;
  height: calc(100% - 25px);

  display: flex;

  align-items: center;
  justify-content: center;
}

.large-preview img {
  display: block;

  max-width: 100%;
  max-height: 100%;

  object-fit: contain;

  filter:
    drop-shadow(
      0 15px 15px
      rgba(30,20,10,.20)
    );

  transition:
    transform .25s ease,
    filter .25s ease;
}

.large-preview:hover img {
  transform: scale(1.025);

  filter:
    drop-shadow(
      0 18px 18px
      rgba(30,20,10,.27)
    );
}

.large-preview-hint {
  margin-top: 8px;

  font-size: 9px;

  letter-spacing: .7px;

  color: rgba(20,15,10,.55);
}


/* =========================================================
   FULLSCREEN PREVIEW — NEW
========================================================= */

.preview-overlay {
  position: fixed;

  inset: 0;

  z-index: 3000;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 55px;

  background:
    rgba(37,28,20,.78);

  backdrop-filter:
    blur(8px);

  -webkit-backdrop-filter:
    blur(8px);

  opacity: 0;
  visibility: hidden;

  pointer-events: none;

  cursor: zoom-out;

  transition:
    opacity .3s ease,
    visibility .3s;
}

.preview-overlay.show {
  opacity: 1;
  visibility: visible;

  pointer-events: auto;
}

.preview-overlay img {
  display: block;

  max-width: 86vw;
  max-height: 86vh;

  object-fit: contain;

  transform: scale(.95);

  filter:
    drop-shadow(
      0 25px 35px
      rgba(0,0,0,.4)
    );

  transition:
    transform .4s cubic-bezier(.2,.8,.2,1);
}

.preview-overlay.show img {
  transform: scale(1);
}

.preview-close {
  position: absolute;

  right: 28px;
  top: 24px;

  color: rgba(255,255,255,.85);

  font-size: 11px;

  letter-spacing: 1px;

  pointer-events: none;
}


/* =========================================================
   STATUS
========================================================= */

.status-panel {
  position: fixed;

  left: 30px;
  bottom: 28px;

  z-index: 900;

  font-size: 11px;
  line-height: 1.55;
  letter-spacing: .6px;

  color: rgba(20,15,10,.7);

  pointer-events: none;
}

.status-dot {
  display: inline-block;

  width: 7px;
  height: 7px;

  margin-right: 6px;

  border-radius: 50%;

  background: #e56525;

  box-shadow:
    0 0 6px
    rgba(229,101,37,.6);
}

.status-dot.active {
  background: #40d9a0;

  box-shadow:
    0 0 8px
    rgba(64,217,160,.8);
}


/* =========================================================
   EJECT
========================================================= */

.eject {
  position: fixed;

  right: 31px;
  bottom: 28px;

  z-index: 900;

  border: 1px solid
    rgba(25,20,15,.5);

  background:
    rgba(236,222,199,.8);

  color: #18130f;

  font-family:
    "Courier New",
    monospace;

  font-size: 11px;

  letter-spacing: 1px;

  padding:
    9px 15px;

  cursor: pointer;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .25s ease,
    transform .15s ease,
    background .15s ease;
}

.eject.show {
  opacity: 1;

  pointer-events: auto;
}

.eject:hover {
  transform: translateY(-2px);

  background: #f1e4cf;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

  .scanner-wrap {
    width: 82vw;
    top: 46%;
  }

  #greenPoster {
    width: 120px;
    left: 3%;
    top: 12%;
  }

  #blueBooklet {
    width: 125px;
    right: 2%;
    top: 12%;
  }

  #whiteBook {
    width: 135px;
    right: 4%;
    bottom: 7%;
  }

  .instruction {
    display: none;
  }

  .large-preview {
    left: 15px;
    top: auto;
    bottom: 60px;

    width: 145px;
    height: 220px;

    transform: scale(.94);
  }

  .large-preview.show {
    transform: scale(1);
  }

}

</style>
</head>


<body>

<div class="desk">


  <div class="title">

    <strong>
      YX SCAN SYSTEM
    </strong>

    <br>

    DESIGN ARCHIVE 01

  </div>


  <div
    class="instruction"
    id="instruction"
  >
    PICK UP AN OBJECT<br>
    DRAG IT INTO THE SCANNER
  </div>


  <!-- =====================================================
       SCANNER
  ====================================================== -->

  <div
    class="scanner-wrap"
    id="scannerWrap"
  >

    <img
      src="scanner.png"
      class="scanner"
      draggable="false"
      alt="Scanner"
    >


    <!-- CRT -->

    <div
      class="crt"
      id="crt"
    >

      <img
        class="scan-result"
        id="scanResult"
        src=""
        alt=""
      >


      <div
        class="scan-light"
      ></div>


      <div
        class="crt-glow"
      ></div>


      <div
        class="crt-lines"
      ></div>


      <div
        class="screen-message"
        id="screenMessage"
      >
        INSERT AN OBJECT<br>
        READY_
      </div>

    </div>


    <!-- TRAY -->

    <div
      class="tray-zone"
      id="trayZone"
    ></div>


    <!-- SCAN BUTTON -->

    <button
      class="scan-button"
      id="scanButton"
      aria-label="Scan"
    ></button>

  </div>


  <!-- =====================================================
       OBJECTS
  ====================================================== -->

  <img
    src="green-poster.png"
    class="object"
    id="greenPoster"
    data-name="GREEN"
    data-result="green-scan.png"
    draggable="false"
    alt="Green Poster"
  >


  <img
    src="blue-booklet.png"
    class="object"
    id="blueBooklet"
    data-name="MULTIPLE FAIRS"
    data-result="blue-scan.png"
    draggable="false"
    alt="Blue Booklet"
  >


  <img
    src="white-book.png"
    class="object"
    id="whiteBook"
    data-name="DOPAMINE"
    data-result="pink-scan.png"
    draggable="false"
    alt="Dopamine Book"
  >


  <!-- =====================================================
       LARGE RESULT PREVIEW
  ====================================================== -->

  <div
    class="large-preview"
    id="largePreview"
  >

    <div
      class="large-preview-label"
      id="largePreviewLabel"
    >
      SCANNED OUTPUT
    </div>


    <div
      class="large-preview-frame"
    >

      <img
        src=""
        id="largePreviewImage"
        alt="Scanned output"
      >

    </div>


    <div
      class="large-preview-hint"
    >
      CLICK TO ENLARGE ↗
    </div>

  </div>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <div
    class="status-panel"
  >

    <span
      class="status-dot"
      id="statusDot"
    ></span>

    <span
      id="statusText"
    >
      WAITING FOR OBJECT
    </span>

  </div>


  <!-- =====================================================
       EJECT
  ====================================================== -->

  <button
    class="eject"
    id="ejectButton"
  >
    EJECT OBJECT
  </button>


</div>


<!-- =======================================================
     FULLSCREEN RESULT
======================================================= -->

<div
  class="preview-overlay"
  id="previewOverlay"
>

  <div
    class="preview-close"
  >
    CLICK ANYWHERE TO CLOSE ×
  </div>

  <img
    src=""
    id="overlayImage"
    alt="Full scan"
  >

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const objects =
  document.querySelectorAll(
    ".object"
  );

const trayZone =
  document.getElementById(
    "trayZone"
  );

const scannerWrap =
  document.getElementById(
    "scannerWrap"
  );

const scanButton =
  document.getElementById(
    "scanButton"
  );

const crt =
  document.getElementById(
    "crt"
  );

const scanResult =
  document.getElementById(
    "scanResult"
  );

const screenMessage =
  document.getElementById(
    "screenMessage"
  );

const instruction =
  document.getElementById(
    "instruction"
  );

const statusText =
  document.getElementById(
    "statusText"
  );

const statusDot =
  document.getElementById(
    "statusDot"
  );

const ejectButton =
  document.getElementById(
    "ejectButton"
  );


/* NEW PREVIEW ELEMENTS */

const largePreview =
  document.getElementById(
    "largePreview"
  );

const largePreviewImage =
  document.getElementById(
    "largePreviewImage"
  );

const largePreviewLabel =
  document.getElementById(
    "largePreviewLabel"
  );

const previewOverlay =
  document.getElementById(
    "previewOverlay"
  );

const overlayImage =
  document.getElementById(
    "overlayImage"
  );


/* =========================================================
   STATE
========================================================= */

let draggingObject = null;

let insertedObject = null;

let scanning = false;

let scanned = false;

let inserting = false;

let offsetX = 0;

let offsetY = 0;


/* =========================================================
   DRAG START
========================================================= */

objects.forEach(
  function(obj) {

    obj.addEventListener(
      "mousedown",
      function(e) {

        if (
          scanning ||
          insertedObject ||
          inserting
        ) {
          return;
        }


        e.preventDefault();


        draggingObject =
          obj;


        const rect =
          obj.getBoundingClientRect();


        offsetX =
          e.clientX -
          rect.left;


        offsetY =
          e.clientY -
          rect.top;


        obj.classList.add(
          "dragging"
        );


        obj.style.right =
          "auto";


        obj.style.bottom =
          "auto";


        obj.style.left =
          rect.left +
          "px";


        obj.style.top =
          rect.top +
          "px";


        obj.style.transform =
          "rotate(0deg) scale(1.04)";

      }
    );

  }
);


/* =========================================================
   DRAG MOVE
========================================================= */

document.addEventListener(
  "mousemove",
  function(e) {

    if (!draggingObject) {
      return;
    }


    draggingObject.style.left =
      (
        e.clientX -
        offsetX
      ) +
      "px";


    draggingObject.style.top =
      (
        e.clientY -
        offsetY
      ) +
      "px";


    checkTrayHover();

  }
);


/* =========================================================
   DRAG END
========================================================= */

document.addEventListener(
  "mouseup",
  function() {

    if (!draggingObject) {
      return;
    }


    const obj =
      draggingObject;


    const shouldInsert =
      isOverTray(obj);


    obj.classList.remove(
      "dragging"
    );


    draggingObject =
      null;


    trayZone.classList.remove(
      "hover"
    );


    if (shouldInsert) {

      insertObject(obj);

    }

  }
);


/* =========================================================
   CHECK TRAY
========================================================= */

function isOverTray(obj) {

  const objectRect =
    obj.getBoundingClientRect();


  const trayRect =
    trayZone.getBoundingClientRect();


  const centerX =
    objectRect.left +
    objectRect.width / 2;


  const centerY =
    objectRect.top +
    objectRect.height / 2;


  return (

    centerX >
    trayRect.left &&

    centerX <
    trayRect.right &&

    centerY >
    trayRect.top &&

    centerY <
    trayRect.bottom

  );

}


/* =========================================================
   TRAY HOVER
========================================================= */

function checkTrayHover() {

  if (!draggingObject) {
    return;
  }


  if (
    isOverTray(
      draggingObject
    )
  ) {

    trayZone.classList.add(
      "hover"
    );

  }

  else {

    trayZone.classList.remove(
      "hover"
    );

  }

}


/* =========================================================
   INSERT OBJECT
========================================================= */

function insertObject(obj) {

  insertedObject =
    obj;


  inserting =
    true;


  scanned =
    false;


  const scannerRect =
    scannerWrap.getBoundingClientRect();


  const trayRect =
    trayZone.getBoundingClientRect();


  obj.classList.add(
    "inserted"
  );


  let insertedWidth;


  if (
    obj.id ===
    "greenPoster"
  ) {

    insertedWidth =
      scannerRect.width *
      .19;

  }

  else if (
    obj.id ===
    "blueBooklet"
  ) {

    insertedWidth =
      scannerRect.width *
      .22;

  }

  else {

    insertedWidth =
      scannerRect.width *
      .21;

  }


  /* STEP 1 — LAND FLAT */

  const targetLeft =
    trayRect.left +
    trayRect.width / 2 -
    insertedWidth / 2;


  const targetTop =
    trayRect.top +
    trayRect.height *
    .30;


  obj.style.transition =
    "left .45s cubic-bezier(.2,.8,.2,1)," +
    "top .45s cubic-bezier(.2,.8,.2,1)," +
    "width .45s cubic-bezier(.2,.8,.2,1)," +
    "transform .45s cubic-bezier(.2,.8,.2,1)," +
    "filter .45s ease";


  obj.style.width =
    insertedWidth +
    "px";


  obj.style.left =
    targetLeft +
    "px";


  obj.style.top =
    targetTop +
    "px";


  obj.style.right =
    "auto";


  obj.style.bottom =
    "auto";


  obj.style.transform =
    "perspective(500px) " +
    "rotateX(58deg) " +
    "rotateZ(-2deg) " +
    "scaleY(.88)";


  screenMessage.innerHTML =
    "OBJECT DETECTED<br>" +
    obj.dataset.name +
    "<br>LOADING_";


  statusText.textContent =
    "LOADING OBJECT";


  instruction.innerHTML =
    "OBJECT DETECTED<br>" +
    "LOADING INTO SCANNER";


  statusDot.classList.add(
    "active"
  );


  /* STEP 2 — SLIDE INTO MACHINE */

  setTimeout(
    function() {

      obj.style.transition =
        "top .75s cubic-bezier(.45,0,.25,1)," +
        "transform .75s cubic-bezier(.45,0,.25,1)," +
        "filter .75s ease";


      obj.style.top =
        (
          targetTop -
          scannerRect.height *
          .055
        ) +
        "px";


      obj.style.transform =
        "perspective(500px) " +
        "rotateX(66deg) " +
        "rotateZ(-2deg) " +
        "scale(.94) " +
        "scaleY(.80)";


      screenMessage.innerHTML =
        "LOADING OBJECT...<br>" +
        obj.dataset.name +
        "<br>PLEASE WAIT_";

    },
    470
  );


  /* STEP 3 — READY */

  setTimeout(
    function() {

      inserting =
        false;


      screenMessage.innerHTML =
        "OBJECT DETECTED<br>" +
        obj.dataset.name +
        "<br>READY TO SCAN_";


      statusText.textContent =
        "OBJECT LOADED";


      instruction.innerHTML =
        "OBJECT LOADED<br>" +
        "PRESS THE GREEN SCAN BUTTON";


      scanButton.classList.add(
        "ready"
      );


      ejectButton.classList.add(
        "show"
      );

    },
    1250
  );

}


/* =========================================================
   SCAN BUTTON
========================================================= */

scanButton.addEventListener(
  "click",
  function() {

    if (
      !insertedObject ||
      scanning ||
      inserting
    ) {
      return;
    }


    startScan();

  }
);


/* =========================================================
   START SCAN
========================================================= */

function startScan() {

  scanning =
    true;


  scanned =
    false;


  hideLargePreview();


  scanButton.classList.remove(
    "ready"
  );


  ejectButton.classList.remove(
    "show"
  );


  scanResult.classList.remove(
    "show"
  );


  scanResult.src =
    insertedObject.dataset.result;


  screenMessage.innerHTML =
    "SCANNING OBJECT...<br>" +
    insertedObject.dataset.name +
    "<br>PROCESSING_";


  statusText.textContent =
    "SCANNING";


  instruction.innerHTML =
    "SCANNING...<br>" +
    "PLEASE WAIT";


  crt.classList.remove(
    "scanning"
  );


  void crt.offsetWidth;


  crt.classList.add(
    "scanning"
  );


  /* Push object farther in */

  const currentTop =
    parseFloat(
      insertedObject.style.top
    );


  insertedObject.style.transition =
    "top .65s ease," +
    "transform .65s ease";


  insertedObject.style.top =
    (
      currentTop -
      18
    ) +
    "px";


  insertedObject.style.transform =
    "perspective(500px) " +
    "rotateX(68deg) " +
    "rotateZ(-2deg) " +
    "scale(.90) " +
    "scaleY(.76)";


  setTimeout(
    function() {

      finishScan();

    },
    2250
  );

}


/* =========================================================
   FINISH SCAN
========================================================= */

function finishScan() {

  crt.classList.remove(
    "scanning"
  );


  /* RESULT ON CRT */

  scanResult.classList.add(
    "show"
  );


  screenMessage.innerHTML =
    "SCAN COMPLETE ✓<br>" +
    insertedObject.dataset.name +
    "<br>300 DPI / RGB";


  statusText.textContent =
    "SCAN COMPLETE";


  statusDot.classList.add(
    "active"
  );


  instruction.innerHTML =
    "SCAN COMPLETE<br>" +
    "CLICK OUTPUT TO ENLARGE";


  ejectButton.classList.add(
    "show"
  );


  scanning =
    false;


  scanned =
    true;


  /* NEW:
     SHOW LARGE RESULT BESIDE SCANNER
  */

  showLargePreview();

}


/* =========================================================
   LARGE PREVIEW — NEW
========================================================= */

function showLargePreview() {

  if (!insertedObject) {
    return;
  }


  const result =
    insertedObject.dataset.result;


  const name =
    insertedObject.dataset.name;


  largePreviewImage.src =
    result;


  overlayImage.src =
    result;


  largePreviewLabel.textContent =
    "SCANNED OUTPUT / " +
    name;


  /*
     Small delay makes the CRT result
     appear first, then the larger
     output follows.
  */

  setTimeout(
    function() {

      largePreview.classList.add(
        "show"
      );

    },
    280
  );

}


/* =========================================================
   HIDE LARGE PREVIEW
========================================================= */

function hideLargePreview() {

  largePreview.classList.remove(
    "show"
  );


  previewOverlay.classList.remove(
    "show"
  );

}


/* =========================================================
   CLICK LARGE PREVIEW
========================================================= */

largePreview.addEventListener(
  "click",
  function() {

    if (!scanned) {
      return;
    }


    previewOverlay.classList.add(
      "show"
    );

  }
);


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

previewOverlay.addEventListener(
  "click",
  function() {

    previewOverlay.classList.remove(
      "show"
    );

  }
);


/* ESC ALSO CLOSES */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Escape"
    ) {

      previewOverlay.classList.remove(
        "show"
      );

    }

  }
);


/* =========================================================
   EJECT BUTTON
========================================================= */

ejectButton.addEventListener(
  "click",
  function() {

    if (
      !insertedObject ||
      scanning ||
      inserting
    ) {
      return;
    }


    ejectObject();

  }
);


/* =========================================================
   EJECT
========================================================= */

function ejectObject() {

  const obj =
    insertedObject;


  /* NEW:
     LARGE RESULT DISAPPEARS
  */

  hideLargePreview();


  scanResult.classList.remove(
    "show"
  );


  screenMessage.innerHTML =
    "EJECTING OBJECT...";


  statusText.textContent =
    "EJECTING";


  instruction.innerHTML =
    "EJECTING OBJECT<br>" +
    "PLEASE WAIT";


  ejectButton.classList.remove(
    "show"
  );


  scanButton.classList.remove(
    "ready"
  );


  const currentTop =
    parseFloat(
      obj.style.top
    );


  obj.style.transition =
    "top .6s cubic-bezier(.3,.8,.3,1)," +
    "transform .6s cubic-bezier(.3,.8,.3,1)";


  obj.style.top =
    (
      currentTop +
      42
    ) +
    "px";


  obj.style.transform =
    "perspective(500px) " +
    "rotateX(58deg) " +
    "rotateZ(-2deg) " +
    "scale(.98) " +
    "scaleY(.88)";


  setTimeout(
    function() {

      restoreObject(obj);


      insertedObject =
        null;


      scanned =
        false;


      statusDot.classList.remove(
        "active"
      );


      statusText.textContent =
        "WAITING FOR OBJECT";


      screenMessage.innerHTML =
        "INSERT AN OBJECT<br>" +
        "READY_";


      instruction.innerHTML =
        "PICK UP AN OBJECT<br>" +
        "DRAG IT INTO THE SCANNER";


      scanResult.src =
        "";


      largePreviewImage.src =
        "";


      overlayImage.src =
        "";

    },
    700
  );

}


/* =========================================================
   RESTORE OBJECT
========================================================= */

function restoreObject(obj) {

  obj.classList.remove(
    "inserted"
  );


  obj.style.transition =
    "all .5s cubic-bezier(.2,.8,.2,1)";


  obj.style.width =
    "";


  obj.style.left =
    "";


  obj.style.top =
    "";


  obj.style.right =
    "";


  obj.style.bottom =
    "";


  obj.style.transform =
    "";


  obj.style.filter =
    "";


  setTimeout(
    function() {

      obj.style.transition =
        "";

    },
    550
  );

}


/* =========================================================
   DOUBLE CLICK CRT = EJECT
========================================================= */

crt.addEventListener(
  "dblclick",
  function() {

    if (
      insertedObject &&
      !scanning &&
      !inserting
    ) {

      ejectObject();

    }

  }
);

</script>

</body>
</html>
